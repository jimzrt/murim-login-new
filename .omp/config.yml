# Project OMP settings. Subscriptions are prepaid capacity; OpenRouter is overflow.
# Model-keyed chains apply whenever that selector is active, regardless of workflow role.
# OpenAI models always prefer Codex subscription, then Cursor, then OpenRouter.
# Adjudicator DeepSeek overflow is in .omp/adjudicator-overlay.yml so review/polish
# Grok does not fall through to a different model.

retry:
  enabled: true
  modelFallback: true
  fallbackRevertPolicy: cooldown-expiry
  usageAwareFallback: true
  usageReservePct: 5
  usageReservePolicy: auto
  fallbackChains:
    # Sol (master / checkpoint): Codex → Cursor → paid OpenRouter.
    openai-codex/gpt-5.6-sol:
      - cursor/gpt-5.6-sol:low
      - openrouter/openai/gpt-5.6-sol:low
    cursor/gpt-5.6-sol:
      - openrouter/openai/gpt-5.6-sol:low

    # Luna (draft / summary / durable update): Codex → Cursor → cheap OpenRouter.
    openai-codex/gpt-5.6-luna:
      - cursor/gpt-5.6-luna:high
      - openrouter/openai/gpt-5.6-luna:high
    cursor/gpt-5.6-luna:
      - openrouter/openai/gpt-5.6-luna:high

    # Review / polish Grok: Cursor → paid OpenRouter Grok.
    cursor/cursor-grok-4.6:
      - openrouter/x-ai/grok-4.6:medium
